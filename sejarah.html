<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEINIA NASIONAL - Preloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #080808;
            font-family: 'Cinzel', 'Times New Roman', serif, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Preloader Overlay Utama */
        .preloader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #161616 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .preloader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Efek Asap & Cahaya Latar Belakang */
        .ambient-glow {
            position: absolute;
            width: 700px;
            height: 350px;
            background: radial-gradient(ellipse, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        /* Container Pilar Penjor Kiri & Kanan */
        .side-decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            pointer-events: none;
            z-index: 2;
        }

        .penjor-pillar {
            width: 110px;
            height: 400px;
            background: linear-gradient(135deg, #e6c567 0%, #a6852b 50%, #d4af37 100%);
            border-radius: 50px 50px 10px 10px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
            position: relative;
            animation: fadeInPillars 1.2s ease forwards;
        }

        /* Detail Hiasan Atas Pilar (Simulasi Janur/Rumbai) */
        .penjor-pillar::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
            background: linear-gradient(to bottom, #fff7cc, #c5a03e);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        .penjor-pillar.left {
            transform-origin: bottom left;
        }

        .penjor-pillar.right {
            transform-origin: bottom right;
        }

        /* Konten Tengah Agar Rapi & Tidak Overlap */
        .center-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 650px;
            width: 100%;
            padding: 0 20px;
        }

        /* Judul Utama */
        .brand-title {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 5px;
            background: linear-gradient(to right, #d4af37, #fff7cc, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.9s ease 0.3s forwards;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        /* Subtitle dengan Garis Elegan */
        .subtitle-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 0.9s ease 0.5s forwards;
        }

        .line {
            height: 1px;
            width: 90px;
            background: linear-gradient(90deg, transparent, #d4af37);
        }

        .line.right {
            background: linear-gradient(90deg, #d4af37, transparent);
        }

        .brand-subtitle {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Lambang Geometris Sayap di Bawah Teks */
        .emblem-wrapper {
            margin-bottom: 35px;
            opacity: 0;
            transform: scale(0.9);
            animation: scaleInEmblem 0.9s ease 0.7s forwards;
        }

        .emblem-svg {
            width: 160px;
            height: 55px;
            fill: #d4af37;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
        }

        /* Bar Progress Loading */
        .progress-box {
            width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: fadeInUp 0.9s ease 0.9s forwards;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #997a25, #fff7cc, #d4af37);
            transition: width 0.1s linear;
        }

        .progress-text {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #c5a03e;
            font-family: monospace;
        }

        /* Konten Utama Website */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #080808;
            text-align: center;
        }

        .main-content h1 {
            color: #d4af37;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        /* Keyframes */
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleInEmblem {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInPillars {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 0.9; transform: scale(1); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.1; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.22; }
        }

        /* Responsif untuk HP / Tablet */
        @media(max-width: 768px) {
            .brand-title { font-size: 1.7rem; letter-spacing: 3px; }
            .brand-subtitle { font-size: 0.7rem; letter-spacing: 2px; }
            .line { width: 40px; }
            .side-decorations { padding: 0 15px; opacity: 0.4; } /* Dibuat lebih transparan di HP agar teks tetap terbaca jelas */
            .penjor-pillar { width: 70px; height: 280px; }
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div class="preloader-overlay" id="preloader">
        <div class="ambient-glow"></div>

        <!-- Pilar / Penjor Samping -->
        <div class="side-decorations">
            <div class="penjor-pillar left"></div>
            <div class="penjor-pillar right"></div>
        </div>

        <!-- Konten Tengah Terpusat & Rapi -->
        <div class="center-content">
            <h1 class="brand-title">GEINIA NASIONAL</h1>
            
            <div class="subtitle-box">
                <div class="line"></div>
                <span class="brand-subtitle">Pusat Integrasi Strategis</span>[span_0](start_span)[span_0](end_span)
                <div class="line right"></div>
            </div>

            <div class="emblem-wrapper">
                <svg class="emblem-svg" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100,45 L85,22 L50,12 L20,17 L5,30 L25,35 L45,30 L70,25 L95,40 Z" opacity="0.9"/>
                    <path d="M100,45 L115,22 L150,12 L180,17 L195,30 L175,35 L155,30 L130,25 L105,40 Z" opacity="0.9"/>
                    <polygon points="100,5 112,25 100,42 88,25" stroke="#d4af37" stroke-width="2" fill="none"/>
                    <circle cx="100" cy="23.5" r="3.5" fill="#fff7cc"/>
                </svg>
            </div>

            <div class="progress-box">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="main-content">
        <div>
            <h1>GEINIA NASIONAL</h1>
            <p style="color: #777; margin-top: 5px; letter-spacing: 1px;">Situs Utama Telah Dimuat</p>
        </div>
    </div>

    <!-- JAVASCRIPT ANIMASI LOADING -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const progressBar = document.getElementById("progressBar");
            const progressText = document.getElementById("progressText");
            const preloader = document.getElementById("preloader");

            let currentProgress = 0;
            
            const loadingInterval = setInterval(function() {
                currentProgress += Math.floor(Math.random() * 6) + 4;
                
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(loadingInterval);
                    
                    setTimeout(function() {
                        preloader.classList.add("fade-out");
                    }, 400);
                }

                progressBar.style.width = currentProgress + "%";
                progressText.textContent = currentProgress + "%";
            }, 60);
        });
    </script>
</body>
</html>
