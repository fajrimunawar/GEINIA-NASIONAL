<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEINIA NASIONAL - Preloader</title>
    <style>
        /* Reset & Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            font-family: 'Cinzel', 'Times New Roman', serif, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Preloader Container Overlay */
        .preloader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #080808 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .preloader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Background Ambient Glow & Fog Effect */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(212, 175, 55, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        /* Main Content Wrapper */
        .preloader-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* Side Pillars Frame Styling (Simulasi Pilar Kiri & Kanan) */
        .pillars-container {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            top: 50%;
            transform: translateY(-50%);
            padding: 0 40px;
            pointer-events: none;
            z-index: 1;
        }

        .pillar {
            width: 120px;
            height: 320px;
            background: linear-gradient(135deg, #dfbc6b 0%, #997a25 50%, #d4af37 100%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 15%, 85% 100%, 15% 100%, 0% 15%);
            opacity: 0.85;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            animation: slideInPillars 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .pillar.left {
            transform-origin: left center;
        }

        .pillar.right {
            transform-origin: right center;
        }

        /* Typography & Branding */
        .brand-title {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(to right, #cfb53b, #fff7cc, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease 0.4s forwards;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        /* Subtitle & Dividers */
        .subtitle-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 35px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.7s forwards;
        }

        .line {
            height: 1px;
            width: 120px;
            background: linear-gradient(90deg, transparent, #d4af37);
        }

        .line.right {
            background: linear-gradient(90deg, #d4af37, transparent);
        }

        .brand-subtitle {
            font-size: 0.95rem;
            letter-spacing: 4px;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Bottom Winged Emblem */
        .emblem-container {
            opacity: 0;
            transform: scale(0.9) translateY(15px);
            animation: scaleInEmblem 1s cubic-bezier(0.25, 1, 0.5, 1) 1s forwards;
            margin-bottom: 40px;
        }

        .emblem-svg {
            width: 140px;
            height: 50px;
            fill: #d4af37;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
        }

        /* Progress Loading Bar & Percentage */
        .loader-progress-box {
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #997a25, #fff7cc, #d4af37);
            transition: width 0.1s linear;
        }

        .progress-text {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #bfa15f;
            font-family: monospace;
        }

        /* Main Content After Loading */
        .main-website {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background: #0b0b0b;
        }

        .main-website h1 {
            font-size: 2.5rem;
            color: #d4af37;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .main-website p {
            color: #888;
            letter-spacing: 1px;
        }

        /* Keyframes Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes scaleInEmblem {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.08; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.18; }
        }

        @keyframes slideInPillars {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 0.85; transform: scale(1); }
        }

        /* Responsive Breakpoints */
        @media(max-width: 768px) {
            .brand-title { font-size: 1.8rem; letter-spacing: 3px; }
            .brand-subtitle { font-size: 0.75rem; letter-spacing: 2px; }
            .line { width: 50px; }
            .pillars-container { display: none; } /* Sembunyikan pilar samping di layar HP agar tetap rapi */
        }
    </style>
</head>
<body>

    <!-- PRELOADER OVERLAY -->
    <div class="preloader-overlay" id="preloader">
        <div class="ambient-glow"></div>

        <!-- Aset Pilar Samping Kiri & Kanan (Estetik Klasik) -->
        <div class="pillars-container">
            <div class="pillar left"></div>
            <div class="pillar right"></div>
        </div>

        <div class="preloader-content">
            <!-- Judul Utama -->
            <h1 class="brand-title">GEINIA NASIONAL</h1>

            <!-- Subtitle & Garis Pembatas -->
            <div class="subtitle-wrapper">
                <div class="line"></div>
                <span class="brand-subtitle">Pusat Integrasi Strategis</span>[span_0](start_span)[span_0](end_span)
                <div class="line right"></div>
            </div>

            <!-- Emblem / Lambang Ikonik Bawah -->
            <div class="emblem-container">
                <svg class="emblem-svg" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                    <!-- Bentuk sayap & elemen geometris khas Wayang/Nusantara -->
                    <path d="M100,50 L85,25 L50,15 L20,20 L5,35 L25,40 L45,35 L70,30 L95,45 Z" opacity="0.8"/>
                    <path d="M100,50 L115,25 L150,15 L180,20 L195,35 L175,40 L155,35 L130,30 L105,45 Z" opacity="0.8"/>
                    <polygon points="100,5 112,28 100,45 88,28" stroke="#d4af37" stroke-width="2" fill="none"/>
                    <circle cx="100" cy="25" r="4" fill="#fff7cc"/>
                </svg>
            </div>

            <!-- Bar Progress & Persentase -->
            <div class="loader-progress-box">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA WEBSITE SETELAH LOADING SELESAI -->
    <div class="main-website">
        <div>
            <h1>GEINIA NASIONAL</h1>
            <p>Selamat Datang di Pusat Integrasi Strategis</p>[span_1](start_span)[span_1](end_span)
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT UNTUK MENGATUR PERSENTASE DAN TRANSISI -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const progressBar = document.getElementById("progressBar");
            const progressText = document.getElementById("progressText");
            const preloader = document.getElementById("preloader");

            let currentProgress = 0;
            
            // Mengatur kecepatan loading (total waktu sekitar 2.2 detik)
            const loadingInterval = setInterval(function() {
                // Penambahan nilai acak yang mulus
                currentProgress += Math.floor(Math.random() * 8) + 3;
                
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(loadingInterval);
                    
                    // Hilangkan preloader dengan efek transisi halus setelah 100%
                    setTimeout(function() {
                        preloader.classList.add("fade-out");
                    }, 400);
                }

                progressBar.style.width = currentProgress + "%";
                progressText.textContent = currentProgress + "%";
            }, 70);
        });
    </script>
</body>
</html>
